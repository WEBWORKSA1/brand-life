# OPTIONAL daily auto-refresh for Brand.Life.
# To switch it on, create .github/workflows/refresh.yml in the GitHub web editor and paste this file's contents.
# (GitHub only lets a person or an app with "workflow" permission add files under .github/workflows.)
# What it does every day at 05:17 UTC: pulls fresh branding headlines into data/news.json, regenerates pages
# (updated dates, sitemap) and commits. GitHub Pages then republishes automatically.
name: Daily refresh

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Refresh news feed
        run: python3 _build/fetch_news.py
      - name: Rebuild pages (Jekyll sources)
        run: python3 _build/build.py
      - name: Commit
        run: |
          git config user.name "brand-life-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily refresh: news feed, dates, sitemap"
          git push
